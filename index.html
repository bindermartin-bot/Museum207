      <param name="A_06" value="id='TEXT' matriz='sí' evaluar='una-sola-vez' columnas='4' filas='7' expresión='TEXT[0,0]=&squot;Unten sehen Sie drei Bilder mit Beschreibungen einer Wahrscheinlichkeit. Klicken Sie zuerst auf das\nBild mit der grössten Wahrscheinlichkeit und danach auf das Bild mit der mittleren Wahrscheinlichkeit.&squot;;TEXT[0,1]=&squot;Ihr Saldo wird angepasst&squot;;TEXT[1,0]=&squot;Wahrscheinlichkeiten werden durch Zahlen zwischen 0 und 1 angegeben.\nDie erste Wahrscheinlichkeit, die wir betrachten ist diese:&squot;;TEXT[1,1]=&squot;Die nächste Wahrscheinlichkeit, die wir betrachten ist schon deutlich kleiner.&squot;;TEXT[1,2]=&squot;Daher ist es besser, den Bereich zwischen 0.0 und 0.1 genauer anzuschauen.&squot;;TEXT[1,3]=&squot;Noch kleiner ist folgende Wahrscheinlichkeit. Je kleiner die Wahrscheinlichkeiten werden,\ndesto mehr braucht man eine Lupe! Eine bessere Darstellung für sehr kleine Zahlen\nist daher sinnvoll!&squot;;TEXT[1,4]=&squot;Man beachte, dass die abgebildeten Skalen bei einer Zahl enden, die dadurch entsteht, dass\n1 durch 10 oder durch 100 geteilt wird.&squot;;TEXT[1,5]=&squot;Dies kann so beliebig oft fortgesetzt werden. Allerdings wird es zunehmend schwieriger, die Nullen\nnach dem Dezimalpunkt zu zählen. Eine bessere Notation ist daher nützlich.&squot;;TEXT[1,6]=&squot;Die wiederholte Division durch 10 wird zuerst als Division einer Potenz von 10 geschrieben.\nMan kann dazu auch einen negativen Exponenten verwenden. Hier am Beispiel 0.00001:&squot;;TEXT[2,0]=&squot;Jetzt können wir die Wahrscheinlichkeiten angeben, die im Spiel verwendet werden.\nVerwenden Sie den Schieberegler rechts oder die Pfeiltatsten.&squot;' tipo='matriz' ">
      <param name="A_07" value="id='TEXTE' matriz='sí' evaluar='una-sola-vez' columnas='4' filas='7' expresión='TEXTE[0,0]=&squot;Below You see three images with descriptions of probabilities. Click first on the\nimage with the highest probability and then on the one with the next smaller probabilty.\nThen verify Yor guess.&squot;;TEXTE[0,1]=&squot;Your balance is adjusted&squot;;TEXTE[1,0]=&squot;Probabilities are given by numbers between 0 and 1.\nThe first probability we are looking at is:&squot;;TEXTE[1,1]=&squot;The next probability is clearly smaller.&squot;;TEXTE[1,2]=&squot;For this it is advantageous, to enhance the interval between 0.0 and 0.1.&squot;;TEXTE[1,3]=&squot;Even smaller is the following probability. The smaller the probabilities get, the more we are in need\nof a good magnifyig glass! A better notation for small numbers seems to be indicated!&squot;;TEXTE[1,4]=&squot;Observe that the numbers on the right of the intervals are obtained by dividing 1 by 10 or by 100.&squot;;TEXTE[1,5]=&squot;This process can be repeated as often we like. Nevertheless it becomes increasingly difficult\nto count the zeros after the decimal point. A better notation seems indicated.&squot;;TEXTE[1,6]=&squot;The repeated division by 10 is first shown a s a division by a power of 10.\nThe number can also be written using negative exponents. Observe this in the example 0.00001:&squot;;TEXTE[2,0]=&squot;Now we can give the probabilities used in the game at the beginning.\nUse the scroll bar or the arrow butten to see more.&squot;' tipo='matriz' ">
